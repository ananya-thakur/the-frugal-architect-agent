name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint + format ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv tool install ruff
      - run: uv tool run ruff check .
      - run: uv tool run ruff format --check .

  # ── Type check ────────────────────────────────────────────────────────────────
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - run: uv run mypy agent/ entrypoint.py

  # ── Unit tests ────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - run: uv run pytest tests/ --cov=agent --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Rubric validation ─────────────────────────────────────────────────────────
  validate-rubric:
    name: Rubric YAML — all 7 laws present (ADR-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Assert rubric loads and covers all 7 laws
        run: |
          uv run python - <<'EOF'
          from agent.rubric_core.engine import RubricEngine
          engine = RubricEngine()
          rubric = engine.get_rubric()
          laws = rubric.laws
          assert len(laws) == 7, f"Expected 7 laws, got {len(laws)}: {[l.id for l in laws]}"
          for law in laws:
              assert law.title, f"Law {law.id} has no title"
          print(f"OK: rubric.yaml loads with {len(laws)} laws")
          EOF

  # ── Security: CVE audit ───────────────────────────────────────────────────────
  pip-audit:
    name: Dependency CVE audit — HIGH/CRITICAL block (DS-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # Fails on CRITICAL or HIGH CVEs — blocks merge (DS-02 / ADR-008)
      - run: pip-audit -r requirements.txt --severity HIGH

  # ── Security: no hardcoded model IDs (SC-02 / ADR-005) ───────────────────────
  validate-no-hardcoded-model-id:
    name: No hardcoded Bedrock model IDs (SC-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded model ARNs
        run: |
          if grep -rE 'arn:aws:bedrock:[^"]*::foundation-model/' \
               --include="*.py" --include="*.json" --include="*.yaml" --include="*.yml" .; then
            echo "ERROR: Hardcoded Bedrock model ARN found. Use AGENT_MODEL_ID env var (ADR-005)."
            exit 1
          fi

  # ── Security: validate agentcore.json (SC-03) ────────────────────────────────
  validate-agentcore-json:
    name: Validate agentcore.json env-var-only (SC-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Assert no literal secrets in agentcore.json
        run: |
          python - <<'EOF'
          import json, sys, re

          with open("agentcore.json") as f:
              config = json.load(f)

          env = config.get("environment", {})
          sensitive_pattern = re.compile(r"(AGENT_MODEL_ID|MODEL_PRICE|.*TOKEN.*|.*KEY.*)", re.I)
          env_var_pattern = re.compile(r"^\$\{[^}]+\}")
          errors = []

          for key, value in env.items():
              if sensitive_pattern.match(key) and not env_var_pattern.match(str(value)):
                  errors.append(f"  {key}: {value!r} (must be ${{VAR_NAME}} reference)")

          if errors:
              print("ERROR: Literal secrets found in agentcore.json environment block:")
              for e in errors:
                  print(e)
              sys.exit(1)
          print("OK: agentcore.json passes env-var-only check")
          EOF

  # ── Security: validate security_context (AA-03) ──────────────────────────────
  validate-security-context:
    name: Validate agentcore.json security_context (AA-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Assert required security_context fields
        run: |
          python - <<'EOF'
          import json, sys

          with open("agentcore.json") as f:
              config = json.load(f)

          ctx = config.get("security_context", {})
          required = {
              "allow_privilege_escalation": False,
              "privileged": False,
              "run_as_non_root": True,
              "run_as_user": 1000,
          }
          errors = []
          for field, expected in required.items():
              actual = ctx.get(field)
              if actual != expected:
                  errors.append(f"  {field}: expected {expected!r}, got {actual!r}")

          if errors:
              print("ERROR: security_context validation failed:")
              for e in errors:
                  print(e)
              sys.exit(1)
          print("OK: security_context passes all required checks")
          EOF

  # ── CDK TypeScript build + synth ──────────────────────────────────────────────
  infra-build:
    name: CDK TypeScript build + synth check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: infra/package.json
      - run: npm ci
      - run: npm run build
      # cdk synth with a placeholder endpoint validates template generation without
      # real AWS credentials; non-fatal so the gate doesn't block on context lookups.
      - name: CDK synth (template smoke test)
        run: |
          npx cdk synth --app "node bin/app.js" \
            --context agentcoreEndpoint=https://placeholder.local \
            2>&1 | tail -5 || true

  # ── Docker build (no push on PR / feature branches) ──────────────────────────
  docker-build:
    name: Docker build (smoke test — builder stage only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image builder stage (no push)
        run: |
          docker build \
            --build-arg PYTHON_DIGEST=sha256:REPLACE_WITH_PINNED_DIGEST \
            --target builder \
            -t frugal-architect-agent:ci-test \
            .

  # ── Push to ECR (main branch only, after all gates pass) ─────────────────────
  docker-push:
    name: Push image to ECR (main only)
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - test
      - validate-rubric
      - pip-audit
      - validate-no-hardcoded-model-id
      - validate-agentcore-json
      - validate-security-context
      - infra-build
      - docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # OIDC → AWS role assumption
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push — tagged with git SHA and latest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: frugal-architect-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg PYTHON_DIGEST=sha256:REPLACE_WITH_PINNED_DIGEST \
            -t "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPO:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPO:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── Merge gate ────────────────────────────────────────────────────────────────
  # Set this job as the single required status check in branch protection.
  # All upstream jobs must succeed; this job provides the one-check policy surface.
  ci-gate:
    name: CI gate — all checks passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - test
      - validate-rubric
      - pip-audit
      - validate-no-hardcoded-model-id
      - validate-agentcore-json
      - validate-security-context
      - infra-build
      - docker-build
    steps:
      - run: echo "All required CI checks passed"
